<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web SIG Brebes Selatan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <h4 style="margin:0">Peta Wilayah Brebes Selatan</h4>
        <p style="font-size: 12px; color: #666;">Interaktif Web GIS - Leaflet.js</p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Inisialisasi Peta (Koordinat pusat Bumiayu, Brebes)
        var map = L.map('map').setView([-7.2356, 109.0069], 11);

        // 2. Pilihan Basemap (Layer Dasar)
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EBP, and the GIS User Community'
        });

        // 3. Menambahkan Marker Titik Penting di Brebes Selatan
        var lokasi = [
            { nama: "Bumiayu", koordinat: [-7.2452, 109.0051], info: "Pusat ekonomi Brebes Selatan" },
            { nama: "Waduk Penjalin", koordinat: [-7.2917, 109.0156], info: "Wisata di Paguyangan" },
            { nama: "Kaligua", koordinat: [-7.2536, 109.1554], info: "Kebun Teh Sirampog" },
            { nama: "Salem", koordinat: [-7.1517, 108.7901], info: "Wilayah Pegunungan Barat" }
        ];

        lokasi.forEach(function(place) {
            L.marker(place.koordinat).addTo(map)
                .bindPopup("<b>" + place.nama + "</b><br>" + place.info);
        });

        // 4. Layer Control (Pojok Kanan Atas)
        var baseMaps = {
            "OpenStreetMap": osm,
            "Satelit (Esri)": satellite
        };

        L.control.layers(baseMaps).addTo(map);

        // 5. Menambahkan Skala Peta
        L.control.scale().addTo(map);
    </script>
</body>
</html>
